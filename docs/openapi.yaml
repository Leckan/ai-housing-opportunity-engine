openapi: 3.1.0
info:
  title: AHOE Demonstration API
  version: 0.1.0
  description: >-
    Local, synthetic-data API for the AHOE demonstration workspace. This API has
    no authentication and must not be exposed as a production service.
servers:
  - url: http://localhost:3000/api/v1
tags:
  - name: Parcels
  - name: Opportunities
  - name: Research
  - name: Reports
paths:
  /health:
    get:
      tags: [Parcels]
      summary: Check demonstration service status
      responses:
        '200':
          description: Demo provider status
  /parcels:
    get:
      tags: [Parcels]
      summary: List synthetic demonstration parcels
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: category
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Paginated synthetic parcel records
  /parcels/search:
    get:
      tags: [Parcels]
      summary: Filter synthetic parcels
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: category
          schema: { type: string }
        - in: query
          name: minArea
          schema: { type: number, minimum: 0 }
        - in: query
          name: maxArea
          schema: { type: number, minimum: 0 }
        - in: query
          name: minScore
          schema: { type: number, minimum: 0, maximum: 100 }
      responses:
        '200': { description: Filtered synthetic parcel records }
  /parcels/{parcelId}:
    get:
      tags: [Parcels]
      summary: Get one synthetic parcel
      parameters:
        - $ref: '#/components/parameters/ParcelId'
      responses:
        '200': { description: Parcel record with synthetic classification }
        '404': { $ref: '#/components/responses/NotFound' }
  /parcels/{parcelId}/analyze:
    post:
      tags: [Opportunities]
      summary: Run deterministic demonstration feasibility calculations
      parameters:
        - $ref: '#/components/parameters/ParcelId'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FeasibilityInputs' }
      responses:
        '200': { description: Illustrative calculation and input assumptions }
        '404': { $ref: '#/components/responses/NotFound' }
  /opportunities/rank:
    get:
      tags: [Opportunities]
      summary: Return explainable synthetic opportunity rankings
      parameters:
        - in: query
          name: minScore
          schema: { type: integer, minimum: 0, maximum: 100, default: 0 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200': { description: Ranked demonstration parcels and model weights }
  /jurisdictions:
    get:
      tags: [Parcels]
      summary: List target pilot jurisdictions and source-readiness status
      responses:
        '200': { description: Target jurisdictions; data coverage is explicitly labeled }
  /housing-indicators:
    get:
      tags: [Opportunities]
      summary: List synthetic housing-need demonstration indicators
      parameters:
        - in: query
          name: geography
          schema: { type: string }
      responses:
        '200': { description: Synthetic relative indicators, not official estimates }
  /regional-analytics:
    get:
      tags: [Opportunities]
      summary: Return Southern California demonstration comparison indicators
      responses:
        '200': { description: Placeholder regional values and jurisdiction readiness }
  /data-providers:
    get:
      tags: [Parcels]
      summary: List configured demonstration data providers
      responses:
        '200': { description: Demo providers; no live data connections }
  /zoning/query:
    post:
      tags: [Research]
      summary: Query the fictional zoning excerpt library
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: { type: string, maxLength: 1600 }
                parcelId: { type: string }
      responses:
        '200': { description: Fictional demonstration response and source excerpts }
        '400': { $ref: '#/components/responses/BadRequest' }
  /ai/chat:
    post:
      tags: [Research]
      summary: Query the deterministic demonstration housing assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, maxLength: 2000 }
                parcelId: { type: string }
      responses:
        '200': { description: Demo answer with synthetic data scope and disclaimer }
        '400': { $ref: '#/components/responses/BadRequest' }
  /reports:
    post:
      tags: [Reports]
      summary: Create a structured demonstration property brief
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parcelId]
              properties:
                parcelId: { type: string }
                format: { type: string, enum: [json, csv] }
      responses:
        '200':
          description: Synthetic-data property brief
          content:
            application/json: { schema: { type: object } }
            text/csv: { schema: { type: string } }
        '400': { $ref: '#/components/responses/BadRequest' }
components:
  parameters:
    ParcelId:
      in: path
      name: parcelId
      required: true
      schema: { type: string }
  schemas:
    FeasibilityInputs:
      type: object
      properties:
        densityUnitsPerAcre: { type: number, minimum: 0 }
        netToGross: { type: number, minimum: 0, maximum: 1 }
        constructionCostPerSqFt: { type: number, minimum: 0 }
        landCostPerSqFt: { type: number, minimum: 0 }
        monthlyRentPerUnit: { type: number, minimum: 0 }
        unitSizeSqFt: { type: number, minimum: 1 }
        affordableSharePct: { type: number, minimum: 0, maximum: 100 }
  responses:
    NotFound:
      description: Requested demonstration parcel was not found
    BadRequest:
      description: Request did not contain valid required fields
